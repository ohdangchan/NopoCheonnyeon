<script>
    function setCardTheme(theme) {
      const surface = document.getElementById('card-surface');
      const buttons = document.querySelectorAll('.theme-btn');
      
      buttons.forEach(btn => {
        btn.classList.remove('border-2', 'border-primary', 'bg-primary/10', 'text-primary');
        btn.classList.add('border', 'border-outline-variant', 'bg-surface-container', 'text-on-surface-variant');
      });

      surface.classList.remove('ink-dark-mode', 'brass-gold-mode', 'hanji-texture');

      if (theme === 'classic') {
        surface.classList.add('hanji-texture');
        const activeBtn = document.getElementById('theme-btn-classic');
        activeBtn.classList.add('border-2', 'border-primary', 'bg-primary/10', 'text-primary');
      } else if (theme === 'dark') {
        surface.classList.add('ink-dark-mode');
        const activeBtn = document.getElementById('theme-btn-dark');
        activeBtn.classList.add('border-2', 'border-primary', 'bg-primary/10', 'text-primary');
      } else if (theme === 'brass') {
        surface.classList.add('brass-gold-mode');
        const activeBtn = document.getElementById('theme-btn-brass');
        activeBtn.classList.add('border-2', 'border-primary', 'bg-primary/10', 'text-primary');
      }
    }

    function toggleCardElement(elementId, isVisible) {
      const target = document.getElementById(elementId);
      if (target) {
        if (isVisible) {
          target.classList.remove('hidden');
        } else {
          target.classList.add('hidden');
        }
      }
    }
  </script>
