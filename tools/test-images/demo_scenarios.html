<style>

<main><div class="info"><h1 id="t"></h1><ol id="s"></ol><div class="expect" id="e"></div><p><small>생성 2026-10-21 10:38 · 영수증은 이 시각부터 24시간 안에만 유효</small></p></div>

<script>
const S=[{"id": "1", "group": "영수증·인증", "title": "인증 전에는 리뷰를 쓸 수 없다", "steps": ["지도 탐색 > 목록 > 맨 위 노포천년테스트식당(0m) 열기", "아래로 내려 \"평점과 리뷰\" 확인"], "expect": "\"방문 인증한 사람만 평점을 남길 수 있어요\" 안내만 보이고 작성 버튼이 없다. 예시 리뷰 12개·재방문율 33%는 보인다.", "images": []}, {"id": "2", "group": "영수증·인증", "title": "영수증이 잘 찍혀 바로 인증 (스캔 연출 → 도장 → 폭죽 → 리뷰)", "steps": ["방문 인증하기 > 영수증 촬영 화면", "아래 \"정상 영수증 A\"를 모니터에 크게 띄우고 틀 안에 맞춰 촬영하기", "빨간 레이저가 영수증을 위아래로 훑고 → 읽은 글자에 형광펜이 칠해지는 것을 보여 준다", "도장이 쾅 찍힘(진동) → 폭죽·색종이 → \"평점·리뷰 남기기\" 누르기", "리뷰 편집기에서 별점·글 + 사진(카메라/앨범 최대 3장) 저장"], "expect": "스캔 연출 → 도장(46년 아님: 시험용 가게라 세월·하루 한도에는 안 들어감) → 폭죽 → 리뷰 작성. 내 리뷰는 이 기기에만 저장되고 평균에 합쳐진다.", "images": [["정상 영수증 A", "test_receipt_a.png"]]}, {"id": "3", "group": "영수증·인증", "title": "영수증 위쪽이 잘렸을 때 → AI 촬영 도우미 → 다시 찍어 성공", "steps": ["방문 인증하기 > \"위쪽이 잘린 영수증\" 촬영", "형광펜 연출 뒤 오류 문구와 함께 AI 촬영 도우미 팝업이 뜬다(처음이면 전송 동의 창이 먼저)", "팝업의 \"다시 찍기\" 누르기 → 카메라로 복귀", "\"정상 영수증 B\"를 촬영해 인증 성공"], "expect": "AI가 \"가게 이름이 잘렸어요, 영수증 위쪽까지 담아 주세요\" 같은 한두 문장을 알려 준다. 다시 찍으면 성공.", "images": [["위쪽 잘림", "test_receipt_cut_top.png"], ["정상 영수증 B", "test_receipt_b.png"]]}, {"id": "4", "group": "영수증·인증", "title": "영수증이 흐리거나 어두울 때 → AI 촬영 도우미", "steps": ["방문 인증하기 > \"흐린 영수증\" 촬영 → 팝업 확인", "다시 찍기 > \"어두운 영수증\" 촬영 → 팝업 확인"], "expect": "흐림은 \"초점·평평하게\", 어두움은 \"밝은 곳에서\" 같은 원인별 안내가 나온다.", "images": [["흐린 영수증", "test_receipt_blur.png"], ["어두운 영수증", "test_receipt_dark.png"]]}, {"id": "5", "group": "영수증·인증", "title": "다른 가게 영수증 / 24시간 지난 영수증", "steps": ["\"다른 가게 영수증(행복분식)\" 촬영 → \"영수증의 가게 이름이 달라요\" + AI 안내", "\"24시간 지난 영수증\" 촬영 → \"영수증이 24시간이 지났어요\""], "expect": "각각 E_RECEIPT_MISMATCH, E_RECEIPT_EXPIRED 안내. 기록은 남지 않는다.", "images": [["다른 가게(행복분식)", "test_receipt_other.png"], ["24시간 지남", "test_receipt_expired.png"]]}, {"id": "6", "group": "영수증·인증", "title": "영수증이 없거나 계속 안 될 때 → 가게 사진 + 위치(30m)로 인증", "steps": ["영수증 화면에서 \"영수증이 없어요\" > 내 위치 확인(테스트 가게는 지금 서 있는 자리라 거리 0m)", "간판 또는 메뉴판 촬영(아래 그림을 모니터에 띄움)", "글자 확인이 3번 실패하면(일부러 엉뚱한 곳 촬영) \"위치 확인 도장\" 선택지가 나온다(설정 스위치로 끌 수 있음)"], "expect": "도장(인증 방법: 가게 사진 또는 위치 확인) → 같은 폭죽 연출 → 리뷰 작성.", "images": [["메뉴판", "test_menuboard.png"], ["간판", "test_sign.png"]]}, {"id": "7", "group": "AI 기능", "title": "AI 번역 (외국인 친구에게 보여 주기)", "steps": ["아무 가게 상세 > 소개글 아래 \"AI 번역\" > English / 日本語 / 简体中文 …", "\"직접 입력\"으로 Thai 같은 언어도 시도", "\"원문 보기\"로 되돌리기"], "expect": "소개글·한 줄 소개·리뷰가 선택한 언어로 바뀌고, 메뉴 이름은 원어가 괄호로 붙는다.", "images": []}, {"id": "8", "group": "AI 기능", "title": "AI 노포 도우미 (지도 맨 위)", "steps": ["지도 탭 맨 위 \"AI 노포 도우미\" 열기", "칩 3개를 차례로: 말로 찾기(비 오는 날 종로…) / 천년 경로(남은 세월 채우는 코스) / 오늘의 노포 코스(지금 위치·영업시간)", "추천 카드를 눌러 가게 상세로 이동", "앱을 껐다 켜서 다시 열면 이전 대화가 그대로", "\"기록 지우기\""], "expect": "후보 가게 안에서만 추천(지어낸 가게 없음), 대화는 이 기기에만 저장.", "images": []}, {"id": "9", "group": "AI 기능", "title": "AI 메뉴 룰렛 · 가게 리뷰 AI 분석", "steps": ["내 패스포트 > \"AI 메뉴 룰렛\" > 룰렛 돌리기(분석 후 메뉴 3개 + 이유·주재료)", "\"마음에 안 들어요, 다시 돌리기\"를 여러 번(최대 10번 = 서로 다른 메뉴 30개)", "리뷰가 많은 가게(송파구 가게·테스트 가게) 상세 > \"AI로 리뷰 분석하기\""], "expect": "룰렛은 앞서 나온 메뉴가 다시 안 나오고 \"본 메뉴 n/30\"이 올라간다. 리뷰 분석은 특장점·추천 메뉴·아쉬운 점·어울리는 사람을 보여 준다.", "images": []}, {"id": "10", "group": "연출·패스포트", "title": "칭호 11단계·도감·승급 연출, 공유 카드, 명예의 전당", "steps": ["내 패스포트 > 칭호 배지 누르기 > 칭호 도감 > 아무 칭호를 눌러 승급 연출 미리보기", "설정 5탭 > 개발자 도구 > \"연출 미리보기: 금빛 도장 + 칭호 승급\"(도장 → 폭죽 → 승급)", "패스포트 > \"패스포트 카드 공유\"(QR 포함) / \"식객 명예의 전당 보기\""], "expect": "100년마다 바뀌는 11개 칭호와 배지 색, 화려한 승급 연출, 공유 카드(QR), 시연용 순위.", "images": []}];
const nav=document.getElementById('nav');let cur=0,sub=0;
let lastGroup='';
S.forEach((sc,i)=>{if(sc.group!==lastGroup){nav.insertAdjacentHTML('beforeend','<h3>'+sc.group+'</h3>');lastGroup=sc.group}
 const b=document.createElement('button');b.textContent=sc.id+'. '+sc.title;b.onclick=()=>{cur=i;sub=0;render()};b.id='b'+i;nav.appendChild(b)});
function render(){const sc=S[cur];
 S.forEach((_,i)=>document.getElementById('b'+i).classList.toggle('on',i===cur));
 document.getElementById('t').textContent=sc.id+'. '+sc.title;
 document.getElementById('s').innerHTML=sc.steps.map(x=>'<li>'+x+'</li>').join('');
 document.getElementById('e').innerHTML='<b>기대 결과</b><br>'+sc.expect;
 const tabs=document.getElementById('tabs');tabs.innerHTML='';
 sc.images.forEach((im,j)=>{const b=document.createElement('button');b.textContent=im[0];b.className=j===sub?'on':'';b.onclick=()=>{sub=j;render()};tabs.appendChild(b)});
 document.getElementById('img').innerHTML=sc.images.length?'<img src="'+sc.images[sub][1]+'">':'<div class="noimg">이 시나리오는 그림 없이 앱에서 직접 진행해요</div>';}
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){cur=Math.min(S.length-1,cur+1);sub=0;render()}if(e.key==='ArrowUp'){cur=Math.max(0,cur-1);sub=0;render()}});
render();
</script></body></html>
