<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>테스트 영수증 (현재 시각)</title>
<style>
body{margin:0;background:#ddd;display:flex;justify-content:center;font-family:'Noto Sans KR',system-ui,sans-serif}
.r{background:#fbfbf7;color:#111;width:360px;margin:24px;padding:28px 28px 36px;font-size:16px;line-height:1.7;box-shadow:0 2px 8px #0003}
h1{font-size:22px;text-align:center;margin:0 0 8px}
hr{border:0;border-top:1px dashed #555;margin:10px 0}
.row{display:flex;justify-content:space-between}
.tot{font-weight:700;font-size:20px}
.c{text-align:center}
</style></head><body>
<div class="r">
<h1>노포천년테스트식당</h1>
<div>사업자번호: 123-45-67891</div>
<div>대표: 홍길동 TEL: 02-000-0000</div>
<div>서울특별시 중구 세종대로 110</div>
<hr>
<div>판매일시: <span id="dt"></span></div>
<div>영수증번호: <span id="no"></span></div>
<hr>
<div class="row"><span>설렁탕 x2</span><span>24,000</span></div>
<div class="row"><span>수육(소) x1</span><span>28,000</span></div>
<div class="row"><span>공기밥 x1</span><span>1,000</span></div>
<hr>
<div class="row tot"><span>합계</span><span>53,000</span></div>
<div>카드번호: 1234-56**-****-7890</div>
<div>승인번호: <span id="ap"></span> 일시불</div>
<hr>
<div class="c">이용해 주셔서 감사합니다</div>
<div class="c" style="font-size:12px">※ 노포 천년 미식가 테스트용 가상 영수증 · 새로고침하면 시각과 번호가 바뀝니다</div>
</div>
<script>
const d=new Date(),p=n=>String(n).padStart(2,'0');
document.getElementById('dt').textContent=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
document.getElementById('no').textContent=`${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
document.getElementById('ap').textContent=String(Math.floor(10000000+Math.random()*89999999));
</script>
</body></html>
